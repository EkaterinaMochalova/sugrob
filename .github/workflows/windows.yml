name: Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
        env:
          SUGROB_ARCH: ${{ matrix.arch }}
      - name: Windows x64 launch check
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\Sugrob-win32-x64\Sugrob.exe' -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput 'smoke.log' -RedirectStandardError 'smoke-error.log'
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Launch check timed out' }
          Get-Content smoke.log
          Get-Content smoke-error.log
          if ($process.ExitCode -ne 0) { throw "Launch failed: $($process.ExitCode)" }
          if (-not (Select-String -Path smoke.log -Pattern 'SMOKE PASS' -Quiet)) { throw 'Missing launch confirmation' }
      - name: Archive portable app
        shell: pwsh
        run: |
          Copy-Item README.md 'dist/Sugrob-win32-${{ matrix.arch }}/README.md'
          Compress-Archive -Path 'dist/Sugrob-win32-${{ matrix.arch }}' -DestinationPath 'Sugrob-Windows-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Sugrob-Windows-${{ matrix.arch }}
          path: windows/Sugrob-Windows-${{ matrix.arch }}.zip
